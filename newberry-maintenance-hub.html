<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b150a">
<title>Newberry House · Maintenance Hub</title>
<script>(function(){try{var t=localStorage.getItem("nbh_theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* fixed brand */
  --pakistan:#1f3d1d; --asparagus:#7da24b; --field:#775d2f; --dun:#d1c7a3;
  --ivory:#fffdee; --platinum:#e0e1de;
  --head:"Trebuchet MS","Segoe UI",Tahoma,sans-serif;
  --body:"Noto Sans",-apple-system,sans-serif;
  --r:16px;
}
/* dark theme (default) */
:root,[data-theme="dark"]{
  --bg:#0a140a; --bg2:#0e1c0d; --panel:#122011; --panel2:#162a14;
  --line:rgba(125,162,75,.16); --line2:rgba(125,162,75,.30);
  --text:#eaf1e1; --muted:#9aab8e; --faint:#6f8166;
  --done:#8fc056; --prog:#d8c98e; --action:#d98a4e; --discuss:#9fb2b8;
  --order:#cdb06a; --urgent:#df6b48; --wait:#a79bbf; --type:#79a06a;
  --needle:var(--ivory); --needle-pin:var(--pakistan);
  --hero1:rgba(125,162,75,.10); --hero2:rgba(31,61,29,.55);
  --grain:.012;
  --shadow:0 18px 40px -28px rgba(0,0,0,.9);
  --btn-fg:#0c160a;
  --input-bg:rgba(0,0,0,.28);
  --tile-bg:rgba(0,0,0,.22);
}
/* light theme */
[data-theme="light"]{
  --bg:#f5efde; --bg2:#ece4cb; --panel:#fffdee; --panel2:#f6efd9;
  --line:rgba(31,61,29,.14); --line2:rgba(31,61,29,.28);
  --text:#1f2d1c; --muted:#5a6a4f; --faint:#8a8a73;
  --done:#3f7a1e; --prog:#a07a1c; --action:#b65a1f; --discuss:#516a73;
  --order:#7a5a1a; --urgent:#b03415; --wait:#5e4c82; --type:#3f7a1e;
  --needle:var(--pakistan); --needle-pin:var(--ivory);
  --hero1:rgba(125,162,75,.22); --hero2:rgba(209,199,163,.55);
  --grain:.020;
  --shadow:0 14px 30px -22px rgba(31,61,29,.45);
  --btn-fg:#fffdee;
  --input-bg:rgba(255,253,238,.85);
  --tile-bg:rgba(255,253,238,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); color:var(--text);
  background:
    radial-gradient(1100px 600px at 78% -8%, var(--hero1), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, var(--hero2), transparent 55%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  transition:color .25s ease, background-color .25s ease;
  background-attachment:fixed;
  min-height:100vh; line-height:1.5;
  padding:0 0 calc(48px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
body::before{ /* faint grain/leaf texture */
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.5; z-index:0;
  background-image:repeating-linear-gradient(115deg,rgba(120,90,40,var(--grain)) 0 2px,transparent 2px 5px);
}
.wrap{position:relative; z-index:1; max-width:860px; margin:0 auto; padding:0 16px}

/* ---------- header ---------- */
header{padding:26px 0 14px; display:flex; align-items:center; gap:16px}
.brand{flex:1;min-width:0}
.theme-toggle{flex:none;display:inline-flex;align-items:center;gap:9px;background:var(--input-bg);
  border:1px solid var(--line2);border-radius:99px;padding:5px 12px 5px 5px;cursor:pointer;
  font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  font-size:10.5px;color:var(--text);transition:background .25s, border-color .25s}
.theme-toggle:hover{border-color:var(--asparagus)}
.t-track{position:relative;width:38px;height:22px;border-radius:99px;background:var(--pakistan);
  box-shadow:inset 0 0 0 1px var(--line2);transition:background .25s}
.t-thumb{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:var(--asparagus);transition:transform .28s cubic-bezier(.4,1.4,.5,1),background .25s}
[data-theme="light"] .t-track{background:var(--dun)}
[data-theme="light"] .t-thumb{background:var(--pakistan);transform:translateX(16px)}
.t-label{min-width:34px;text-align:left}
.logo{width:62px;height:62px;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.brand h1{font-family:var(--head);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  font-size:clamp(17px,4.4vw,23px);margin:0;color:var(--text)}
.brand .sub{font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--asparagus);margin-top:3px;font-weight:600}
[data-theme="light"] .brand .sub{color:var(--pakistan)}

.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);margin:6px 0 20px}

/* ---------- card ---------- */
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.02)}

/* ---------- gauge ---------- */
.gauge-card{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.gauge{flex:none;width:230px;max-width:62vw;position:relative;text-align:center}
.gauge svg{width:100%;height:auto;display:block;overflow:visible}
.gauge .read{position:absolute;left:0;right:0;top:50%;transform:translateY(-18%)}
.gauge .pct{font-family:var(--head);font-weight:700;font-size:42px;line-height:1;color:var(--text)}
.gauge .pct span{font-size:19px;color:var(--asparagus)}
[data-theme="light"] .gauge .pct span{color:var(--pakistan)}
.gauge .cap{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-top:7px}
.gscale{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:-2px;padding:0 8px;letter-spacing:.1em}
.tiles{flex:1;min-width:200px;display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:9px}
.tile{background:var(--tile-bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px}
.tile b{font-family:var(--head);font-size:24px;display:block;line-height:1.1;color:var(--text)}
.tile small{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:block;margin-top:3px}
.tile.t-done b{color:var(--done)} .tile.t-prog b{color:var(--prog)}
.tile.t-action b{color:var(--action)} .tile.t-open b{color:var(--discuss)}

/* linear progress */
.bar{height:9px;border-radius:99px;background:var(--tile-bg);overflow:hidden;margin-top:14px;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pakistan),var(--asparagus));transition:width .6s cubic-bezier(.2,.7,.2,1)}

/* ---------- controls ---------- */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:150px}
.lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
select,input[type=text],input[type=search]{
  font-family:var(--body);font-size:14.5px;color:var(--text);background:var(--input-bg);
  border:1px solid var(--line2);border-radius:11px;padding:11px 12px;width:100%;appearance:none}
select:focus,input:focus{outline:none;border-color:var(--asparagus)}
.btn{font-family:var(--head);font-weight:700;letter-spacing:.06em;font-size:13px;cursor:pointer;
  background:linear-gradient(180deg,var(--asparagus),#6a9040);color:var(--btn-fg);border:none;
  border-radius:11px;padding:11px 16px;white-space:nowrap;transition:transform .12s, filter .12s}
.btn:active{transform:translateY(1px)} .btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.ghost.on{background:rgba(125,162,75,.18);border-color:var(--asparagus);color:var(--text)}

.syncrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.modetag{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--prog);box-shadow:0 0 0 3px rgba(216,201,142,.18)}
.dot.live{background:var(--done);box-shadow:0 0 0 3px rgba(143,192,86,.18)}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:12px;letter-spacing:.04em;cursor:pointer;padding:7px 12px;border-radius:99px;
  border:1px solid var(--line2);background:var(--input-bg);color:var(--muted);user-select:none}
.chip.on{color:var(--text);border-color:var(--asparagus);background:rgba(125,162,75,.16)}
.chip b{font-weight:700;color:inherit;opacity:.8;margin-left:5px}

/* ---------- groups ---------- */
details.grp{background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
details.grp[open]{border-color:var(--line2)}
summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
.swatch{width:5px;align-self:stretch;border-radius:99px;flex:none;min-height:22px}
summary .gname{font-family:var(--head);font-weight:700;letter-spacing:.05em;font-size:14.5px;color:var(--text);flex:1;text-transform:uppercase}
summary .gcount{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
summary .caret{color:var(--faint);font-size:13px;transition:transform .25s;font-family:var(--body)}
details[open] summary .caret{transform:rotate(180deg)}
.glist{padding:2px 12px 12px}

.task{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-top:1px solid var(--line)}
.glist .task:first-child{border-top:none}
.task .sw{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.task .body{flex:1;min-width:0}
.task .ttl{font-size:14.5px;color:var(--text);font-weight:500}
.task .meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;padding:2px 7px;border-radius:6px;
  border:1px solid var(--line2);color:var(--muted)}
.tag.side-Classroom{color:#bcd1c0;border-color:rgba(143,192,86,.4)}
.tag.side-Project{color:var(--dun);border-color:rgba(209,199,163,.4)}
.task .note{font-size:12px;color:var(--faint);font-style:italic;margin-top:4px}
.stat{flex:none}
.stat select{font-size:11.5px;padding:7px 8px;border-radius:9px;min-width:118px;
  font-family:var(--head);font-weight:700;letter-spacing:.03em}
.editfields{display:flex;flex-direction:column;gap:7px;width:100%;margin-top:2px}
.editfields input{font-size:13px;padding:8px 9px}
.del{background:none;border:none;color:var(--urgent);font-size:11px;cursor:pointer;letter-spacing:.1em;
  text-transform:uppercase;font-family:var(--head);font-weight:700;padding:4px 0}
.addrow{margin:6px 4px 0;text-align:center}
.empty{padding:30px 14px;text-align:center;color:var(--faint);font-size:13.5px}

footer{margin-top:26px;text-align:center;color:var(--faint);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
footer .divider{margin:0 0 16px}

/* diagnostic panel */
.diag{font-size:13.5px}
.diag-head{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:6px}
.diag-head b{font-family:var(--head);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.diag-ok{color:var(--done)} .diag-mix{color:var(--prog)} .diag-err{color:var(--urgent)}
.d-close{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
.diag-hint{color:var(--muted);margin:6px 0 10px;line-height:1.55}
.diag-hint a{color:var(--asparagus);text-decoration:underline;word-break:break-all}
[data-theme="light"] .diag-hint a{color:var(--pakistan)}
.diag-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.diag-list li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--tile-bg)}
.diag-list li span{color:var(--muted);font-size:12px;text-align:right}
.diag-list .d-ok{border-color:rgba(125,162,75,.4)}
.diag-list .d-bad span{color:var(--urgent)}

@media(max-width:560px){
  .gauge{max-width:none;width:100%;margin:0 auto}
  .gauge-card{justify-content:center}
  header{gap:12px}
  .stat select{min-width:104px}
}
</style>
</head>

/* status definitions: key -> {label, color, weight, order} */
const STATUS = {
  "done":     {label:"Done",          color:"var(--done)",   w:1,   o:6},
  "progress": {label:"In Progress",   color:"var(--prog)",   w:.5,  o:1},
  "action":   {label:"Action needed", color:"var(--action)", w:0,   o:0},
  "urgent":   {label:"Urgent",        color:"var(--urgent)", w:0,   o:-1},
  "order":    {label:"To Order",      color:"var(--order)",  w:0,   o:3},
  "discuss":  {label:"To Discuss",    color:"var(--discuss)",w:0,   o:4},

};
const STATUS_ORDER = ["urgent","action","progress","wait","order","discuss","cleaning","maint","garden","done"];

function normKey(raw){
  const s=(raw||"").trim().toLowerCase();
  if(s==="done") return "done";
  if(s.indexOf("progress")>=0) return "progress";
  if(s.indexOf("action")>=0) return "action";
  if(s==="urgent") return "urgent";
  if(s.indexOf("order")>=0) return "order";
  if(s.indexOf("discuss")>=0||s==="to discuss") return "discuss";
  if(s.indexOf("wait")>=0) return "wait";
  if(s.indexOf("clean")>=0) return "cleaning";
  if(s.indexOf("maint")>=0) return "maint";
  if(s.indexOf("garden")>=0||s==="gerden") return "garden";
  return "discuss";
}

/* ---- editable state, persisted locally when the file runs on a device ---- */
let state = JSON.parse(JSON.stringify(APP.boards));
let mode="snapshot", lastUpd="";
try{
  const saved=localStorage.getItem("nbh_state");
  if(saved){const o=JSON.parse(saved); state=o.state; mode=o.mode||"snapshot"; lastUpd=o.upd||"";}
}catch(e){}
function persist(){ try{ localStorage.setItem("nbh_state",JSON.stringify({state,mode,upd:lastUpd})); }catch(e){} }

let curBoard = Object.keys(state).sort((a,b)=>state[b].order-state[a].order)[0];
let sideFilter="all", query="", editMode=false;

/* ---- DOM refs ---- */
const $=id=>document.getElementById(id);
const boardSel=$("boardSel"), groupsEl=$("groups");

/* populate board selector */
Object.keys(state).sort((a,b)=>state[b].order-state[a].order).forEach(k=>{

/* ---- gauge ---- */
const ARC_LEN=Math.PI*84; // ≈263.9
function setGauge(pct){
  const v=Math.max(0,Math.min(100,pct));
  const arc=$("arcVal");
  arc.setAttribute("stroke-dasharray", (ARC_LEN*v/100)+" "+ARC_LEN);
  $("needle").setAttribute("transform","rotate("+(-90 + v*1.8)+" 100 100)");
  $("pct").innerHTML=Math.round(v)+'<span>%</span>';
}

/* ---- compute + render ---- */
function tasks(){ return state[curBoard].tasks; }

function computeStats(list){
  let done=0,prog=0,action=0,open=0,wsum=0;
  list.forEach(t=>{const k=normKey(t.s); wsum+=STATUS[k].w;
    if(k==="done")done++; else if(k==="progress")prog++;
    else if(k==="action"||k==="urgent")action++; else open++;});
  const pct=list.length?Math.round(wsum/list.length*100):0;
  return {done,prog,action,open,pct,total:list.length};
}

function render(){
  const all=tasks();
  const stats=computeStats(all); // gauge always reflects full board
  setGauge(stats.pct);
  $("cDone").textContent=stats.done; $("cProg").textContent=stats.prog;
  $("cAction").textContent=stats.action; $("cOpen").textContent=stats.open;
  $("barFill").style.width=stats.pct+"%";

  // filtered for display
  const q=query.toLowerCase();
  const shown=all.filter(t=>{
    if(sideFilter!=="all" && (t.side||"Grounds")!==sideFilter) return false;
    if(q){const blob=(t.a+" "+t.t+" "+(t.n||"")+" "+(t.o||"")).toLowerCase(); if(blob.indexOf(q)<0) return false;}
    return true;
  });

  // group by status
  const groups={};
  shown.forEach((t)=>{const k=normKey(t.s); (groups[k]=groups[k]||[]).push(t);});
  groupsEl.innerHTML="";

  if(!shown.length){
    groupsEl.innerHTML='<div class="card empty">No tasks match this view.'+(editMode?'':'')+'</div>';
    if(editMode) addCardAdder();
    return;
  }

  STATUS_ORDER.forEach(k=>{
    if(!groups[k]) return;
    const def=STATUS[k], items=groups[k];
    const open = (k!=="done"); // active items expanded, Done collapsed
    const d=document.createElement("details"); d.className="grp"; if(open)d.open=true;
    d.innerHTML=
      '<summary><span class="swatch" style="background:'+def.color+'"></span>'+
      '<span class="gname">'+def.label+'</span>'+
      '<span class="gcount">'+items.length+'</span>'+
      '<span class="caret">▾</span></summary>'+
      '<div class="glist"></div>';
    const list=d.querySelector(".glist");
    items.forEach(t=>list.appendChild(taskRow(t)));
    groupsEl.appendChild(d);
  });

  if(editMode) addCardAdder();
}

function statusSelect(t){
  const sel=document.createElement("select");
  STATUS_ORDER.forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=STATUS[k].label;sel.appendChild(o);});
  sel.value=normKey(t.s);
  sel.style.color=STATUS[sel.value].color;
  sel.onchange=()=>{ t.s=STATUS[sel.value].label; persist(); render(); };
  return sel;
}

function taskRow(t){
  const row=document.createElement("div"); row.className="task";
  const k=normKey(t.s);
  const sw=document.createElement("div"); sw.className="sw"; sw.style.background=STATUS[k].color; row.appendChild(sw);

  const body=document.createElement("div"); body.className="body";
  if(editMode){
    const ef=document.createElement("div"); ef.className="editfields";
    const ia=mkInput(t.a,"Area"); ia.oninput=()=>{t.a=ia.value;persist();};
    const it=mkInput(t.t,"Task"); it.oninput=()=>{t.t=it.value;persist();};
    const ino=mkInput(t.n||"","Note (optional)"); ino.oninput=()=>{t.n=ino.value;persist();};
    ef.appendChild(ia); ef.appendChild(it); ef.appendChild(ino);
    const del=document.createElement("button"); del.className="del"; del.textContent="Delete task";
    del.onclick=()=>{const arr=tasks();const i=arr.indexOf(t);if(i>=0)arr.splice(i,1);persist();render();};
    ef.appendChild(del);
    body.appendChild(ef);
  }else{
    const ttl=document.createElement("div"); ttl.className="ttl"; ttl.textContent=t.t; body.appendChild(ttl);
    const meta=document.createElement("div"); meta.className="meta";
    const area=document.createElement("span"); area.textContent=t.a; meta.appendChild(area);
    const side=t.side||"Grounds";
    const tg=document.createElement("span"); tg.className="tag side-"+side; tg.textContent=side; meta.appendChild(tg);
    if(t.o){const ow=document.createElement("span"); ow.className="tag"; ow.textContent=t.o; meta.appendChild(ow);}
    body.appendChild(meta);
    if(t.n){const nt=document.createElement("div"); nt.className="note"; nt.textContent='“'+t.n+'”'; body.appendChild(nt);}
  }
  row.appendChild(body);

  const stat=document.createElement("div"); stat.className="stat"; stat.appendChild(statusSelect(t)); row.appendChild(stat);
  return row;
}
function mkInput(v,ph){const i=document.createElement("input");i.type="text";i.value=v;i.placeholder=ph;return i;}

function addCardAdder(){
  const c=document.createElement("div"); c.className="card"; c.style.textAlign="center";
  const b=document.createElement("button"); b.className="btn"; b.textContent="+ Add task to this board";
  b.onclick=()=>{ tasks().unshift({a:"New area",t:"New task",s:"Action needed",n:"",side:sideFilter==="all"?"Grounds":sideFilter,o:""}); persist(); render(); };
  c.appendChild(b); groupsEl.appendChild(c);
}

/* ---- live sync from the Google Sheet (gviz CSV) ---- */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1); // strip BOM
  const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false;} else cur+=ch; }
    else{ if(ch==='"')q=true; else if(ch===','){row.push(cur);cur="";}
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur="";}
      else if(ch==='\r'){} else cur+=ch; } }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows;
}
/* weekly boards have grounds in cols A-D and classroom in cols E-I, with areas carried down */
function rowsToTasks(rows){
  const out=[]; let gArea="",cArea="";
  rows.forEach((r,idx)=>{
    if(idx===0) return; // header
    const ga=(r[0]||"").trim(), gt=(r[1]||"").trim(), gs=(r[2]||"").trim(), gn=(r[3]||"").trim();
    if(ga) gArea=ga;
    if(gt && gs) out.push({a:gArea||ga,t:gt,s:gs,n:gn,side:"Grounds",o:""});
    const ca=(r[4]||"").trim(), ct=(r[5]||"").trim(), cs=(r[6]||"").trim(), cn=(r[8]||r[7]||"").trim();
    if(ca) cArea=ca;
    if(ct && cs) out.push({a:cArea||ca,t:ct,s:cs,n:cn,side:"Classroom",o:""});
  });
  return out;
}
async function fetchSheet(name){
  const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(name);
  let res;
  try{ res=await fetch(url,{cache:"no-store",credentials:"omit",redirect:"follow"}); }
  catch(e){ return {ok:false, reason:"blocked", detail:"Browser blocked the request (sandbox or no network)"}; }
  if(res.status===404) return {ok:false, reason:"missing", detail:'Tab "'+name+'" not found in the sheet'};
  if(!res.ok)         return {ok:false, reason:"http",    detail:"HTTP "+res.status+" "+res.statusText};
  const txt=await res.text();
  if(/^\s*<(!doctype|html)/i.test(txt))
                      return {ok:false, reason:"private", detail:"Sheet is not shared publicly (Google returned a sign-in page)"};
  const rows=parseCSV(txt);
  const tasks=rowsToTasks(rows);
  if(!tasks.length)   return {ok:false, reason:"empty",   detail:"Connected, but no rows matched the weekly Grounds/Classroom layout"};
  return {ok:true, tasks, rows:rows.length};
}

async function syncLive(){
  const btn=$("syncBtn"); const oldTxt=btn.textContent; btn.textContent="Syncing…"; btn.disabled=true;
  clearDiag();
  const names=Object.keys(state).filter(k=>state[k].live!==false);
  const results=[];
  for(const name of names){
    const r=await fetchSheet(name); r.name=name; results.push(r);
    if(r.ok) state[name].tasks=r.tasks;
  }
  btn.textContent=oldTxt; btn.disabled=false;

  const okCount=results.filter(r=>r.ok).length;
  if(okCount){
    mode="live"; lastUpd=new Date().toLocaleString();
    persist(); updateModeUI(); render();
  }
  showDiag(results, okCount, names.length);
}

function clearDiag(){ const d=$("diag"); if(d) d.remove(); }
function showDiag(results, okCount, total){
  clearDiag();
  const wrap=document.createElement("div"); wrap.className="card diag"; wrap.id="diag";
  const allBlocked = results.length && results.every(r=>!r.ok && r.reason==="blocked");
  const allPrivate = results.length && results.every(r=>!r.ok && r.reason==="private");

  let head="";
  if(okCount===total) head='<b class="diag-ok">Live sync successful</b> — '+okCount+' of '+total+' board'+(total===1?'':'s')+' updated';
  else if(okCount)    head='<b class="diag-mix">Partial sync</b> — '+okCount+' of '+total+' board'+(total===1?'':'s')+' updated';
  else if(allBlocked) head='<b class="diag-err">Sync blocked by the browser</b>';
  else if(allPrivate) head='<b class="diag-err">Sheet is not shared publicly</b>';
  else                head='<b class="diag-err">Sync failed</b>';

  let hint="";
  if(allBlocked){
    hint='<p class="diag-hint">This usually happens when the page is opened inside an app preview that blocks third-party requests. '+
         'Save the file to your phone or desktop and open it from there — live sync works directly against Google Sheets without a server.</p>';
  } else if(allPrivate){
    hint='<p class="diag-hint">Open the sheet in Google Sheets → <b>Share</b> → set <b>General access</b> to '+
         '<b>“Anyone with the link – Viewer”</b>, then try again.</p>';
  } else if(okCount<total){
    hint='<p class="diag-hint">Some tabs need attention — see the list below. Use <i>Add sheet</i> to pull in a new week\'s tab.</p>';
  }

  const list=results.map(r=>{
    if(r.ok) return '<li class="d-ok">'+esc(r.name)+' <span>'+r.tasks.length+' tasks loaded</span></li>';
    return '<li class="d-bad">'+esc(r.name)+' <span>'+esc(r.detail)+'</span></li>';
  }).join("");

  const testUrl="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(results[0]?.name||"");
  const test = results.length ? '<p class="diag-hint"><a href="'+testUrl+'" target="_blank" rel="noopener">Open this test URL in a new tab</a> — if you see CSV text, the sheet is public; if you see a sign-in page, it isn\'t yet.</p>' : '';

  wrap.innerHTML='<div class="diag-head">'+head+' <button class="d-close" aria-label="Close">×</button></div>'+
                 hint+'<ul class="diag-list">'+list+'</ul>'+test;
  // insert after the controls card
  const anchor=document.querySelector(".syncrow").closest(".card");
  anchor.parentNode.insertBefore(wrap, anchor.nextSibling);
  wrap.querySelector(".d-close").onclick=clearDiag;
}
function esc(s){return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);}

async function addSheetByName(){
  const name=prompt("Sheet tab name to add (e.g. 11-15 May)");
  if(!name) return;
  const key=name.trim();
  if(state[key]){ alert("This sheet is already loaded."); return; }
  state[key]={label:key, order:(Math.max(0,...Object.values(state).map(b=>b.order||0))+1), live:true, tasks:[]};
  const op=document.createElement("option"); op.value=key; op.textContent=key;
  boardSel.appendChild(op); boardSel.value=key; curBoard=key;
  const r=await fetchSheet(key); r.name=key;
  if(r.ok){
    state[key].tasks=r.tasks;
    mode="live"; lastUpd=new Date().toLocaleString();
    persist(); updateModeUI(); render();
    showDiag([r],1,1);
  } else {
    showDiag([r],0,1);
    render();
  }
}
function updateModeUI(){
  $("dot").className="dot"+(mode==="live"?" live":"");
  $("modeTxt").textContent= mode==="live"?"Live":"Snapshot";
  $("updTxt").textContent= lastUpd? lastUpd : (mode==="live"?"just now":"loaded from build");
}

/* ---- events ---- */
boardSel.onchange=()=>{curBoard=boardSel.value;render();};
$("search").oninput=e=>{query=e.target.value;render();};
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  c.classList.add("on"); sideFilter=c.dataset.side; render();
});
$("editBtn").onclick=()=>{editMode=!editMode; $("editBtn").classList.toggle("on",editMode);
  $("editBtn").textContent=editMode?"Done editing":"Edit"; render();};
$("syncBtn").onclick=syncLive;
$("addSheetBtn").onclick=addSheetByName;

/* ---- theme toggle ---- */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  try{ localStorage.setItem("nbh_theme",t); }catch(e){}
  $("themeLbl").textContent = t==="light" ? "Light" : "Dark";
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", t==="light" ? "#f5efde" : "#0b150a");
}
(function initTheme(){
  let t="dark";
  try{ const s=localStorage.getItem("nbh_theme"); if(s==="light"||s==="dark") t=s; }catch(e){}
  applyTheme(t);
})();
$("themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme")||"dark";
  applyTheme(cur==="light"?"dark":"light");
};

updateModeUI();
render();
</script>
